name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log
      - name: Lint and release build (report only)
        continue-on-error: true
        run: |
          set +e
          ./gradlew lintDebug > lint-run.log 2>&1
          ./gradlew assembleRelease > release-build.log 2>&1
          mkdir -p ci
          {
            echo "commit: ${GITHUB_SHA}"
            if grep -q "BUILD SUCCESSFUL" release-build.log; then echo "release build (R8): OK"; else echo "release build (R8): FAILED"; grep -E "^e: |error:|R8|Missing class|What went wrong" release-build.log | head -40; fi
            echo "---- lint"
            if [ -f app/build/reports/lint-results.txt ]; then grep -E "^(Error|Warning):|errors?, .*warnings?|: (Error|Warning):" app/build/reports/lint-results.txt | head -80; tail -3 app/build/reports/lint-results.txt; else echo "no lint report"; tail -20 lint-run.log; fi
          } > ci/check-summary.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roozyar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
      - name: Commit exported Room schemas
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add app/schemas
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Room schemas [skip ci]"
            git push
          fi
      - name: Save failure summary to the repo
        if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ci
          { echo "commit: ${GITHUB_SHA}"; grep -E "^e: |error:|FAILED|What went wrong|AssertionError|expected:|Execution failed|Unresolved reference|Test.*FAILED" build.log | head -60; } > ci/last-failure.txt || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f ci/last-failure.txt
          git commit -m "chore: record CI failure summary [skip ci]" || true
          git push || true
      - name: Commit check summary
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f ci/check-summary.txt || true
          git diff --cached --quiet || (git commit -m "chore: record check summary [skip ci]" && git push) || true
