name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roozyar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
      - name: Commit exported Room schemas
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add app/schemas
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Room schemas [skip ci]"
            git push
          fi
      - name: Save failure summary to the repo
        if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ci
          { echo "commit: ${GITHUB_SHA}"; grep -E "^e: |error:|FAILED|What went wrong|AssertionError|expected:|Execution failed|Unresolved reference|Test.*FAILED" build.log | head -60; } > ci/last-failure.txt || true
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f ci/last-failure.txt
          git commit -m "chore: record CI failure summary [skip ci]" || true
          git push || true
